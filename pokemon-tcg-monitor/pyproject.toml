[project]
name = "pokemon-tcg-monitor"
version = "0.1.0"
description = "Polite stock & price monitor for Pokemon TCG products with Discord/ntfy alerts"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tcg-monitor = "tcg_monitor.__main__:main"

[tool.setuptools]
packages = ["tcg_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
